# fly.toml - Configuración para Fly.io
# Ejecutar: fly launch (primera vez) y luego fly deploy

app = "cronoestrato-2023"
primary_region = "mad"

[build]
  # Usar Dockerfile personalizado
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Volumen persistente para database.json
[mounts]
  source = "cronoestrato_data"
  destination = "/data"

# Recursos gratuitos (shared-cpu-1x, 256MB RAM)
[[vm]]
  size = "shared-cpu-1x"
  cpus = 1
  memory_mb = 256